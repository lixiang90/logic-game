<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Logic farm floating above the theorem clouds</title>
  <desc id="desc">A stylized floating farm with circuit-shaped irrigation channels and geometric crops.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08152f"/>
      <stop offset="0.62" stop-color="#173255"/>
      <stop offset="1" stop-color="#07101f"/>
    </linearGradient>
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#315d54"/>
      <stop offset="0.14" stop-color="#26473f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
    <pattern id="stars" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="20" r="1.2" fill="#a5f3fc" opacity=".7"/>
      <circle cx="68" cy="52" r=".8" fill="#fde68a" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#stars)"/>
  <path d="M110 640 C330 530 510 580 690 630 S1080 760 1490 570 V900 H110Z" fill="#020617" opacity=".48"/>
  <path d="M270 365 Q800 170 1330 365 L1240 710 Q800 855 360 710Z" fill="url(#island)" stroke="#67e8f9" stroke-opacity=".24" stroke-width="5"/>
  <path d="M360 415 Q800 280 1240 415" fill="none" stroke="#86efac" stroke-width="34" stroke-linecap="round" opacity=".58"/>
  <g fill="#2b1e18" stroke="#c08457" stroke-width="5">
    <rect x="430" y="430" width="260" height="180" rx="24"/>
    <rect x="720" y="370" width="260" height="180" rx="24"/>
    <rect x="1010" y="430" width="160" height="180" rx="24"/>
  </g>
  <g fill="none" stroke="#22d3ee" stroke-width="9" stroke-linecap="round" opacity=".8">
    <path d="M330 680 H800 V570"/>
    <path d="M800 570 V650 H1190"/>
    <circle cx="800" cy="570" r="16" fill="#083344"/>
  </g>
  <g fill="#facc15">
    <path d="M480 560V470m0 45-28-24m28 8 27-29M555 560V465m0 43-25-21m25 5 30-27M625 560V480m0 30-23-20m23 5 25-22" stroke="#facc15" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g fill="none" stroke="#a78bfa" stroke-width="8">
    <path d="M780 510 Q840 410 900 510 Q840 560 780 510Z"/>
    <circle cx="840" cy="487" r="15" fill="#ddd6fe"/>
  </g>
  <g fill="#f472b6">
    <circle cx="1060" cy="500" r="22"/><circle cx="1120" cy="535" r="22"/><circle cx="1080" cy="570" r="22"/>
  </g>
  <g opacity=".4" filter="url(#glow)" fill="#67e8f9"><ellipse cx="800" cy="740" rx="480" ry="42"/></g>
</svg>

