name: Deploy main and dev to GitHub Pages

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: development

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            development/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # The current main branch still relies on this action to inject /logic-game.
          static_site_generator: next

      - name: Build production site
        run: |
          npm ci
          npm run build

      - name: Build development site
        working-directory: development
        env:
          NEXT_PUBLIC_BASE_PATH: /logic-game/dev
        run: |
          npm ci
          npm run build

      - name: Assemble Pages artifact
        shell: bash
        run: |
          mkdir -p site/dev
          cp -a out/. site/
          cp -a development/out/. site/dev/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
